<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Création Partie</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-white p-8">

  <h1 class="text-4xl font-bold text-center mb-10 text-emerald-400">Lycéopolis - Test</h1>

  <div class="max-w-md mx-auto">
    <button onclick="createParty()" 
      class="w-full bg-emerald-600 hover:bg-emerald-500 py-8 rounded-3xl text-2xl font-bold">
      Créer une partie
    </button>

    <div id="result" class="mt-8 text-center text-lg"></div>
  </div>

  <script>
    function createParty() {
      const name = prompt("Nom de ta partie ?", "Partie de Test");
      
      if (name) {
        document.getElementById("result").innerHTML = `
          ✅ Partie créée avec succès !<br>
          <strong>${name}</strong><br>
          ID : PARTY-${Date.now()}
        `;
        alert("Partie créée : " + name);
      } else {
        alert("Création annulée");
      }
    }
  </script>
</body>
</html>
